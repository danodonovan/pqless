[package]
name = "pqless"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Browse Parquet files a screenful at a time, like less"
authors = ["Dan O'Donovan <dan.odonovan@gmail.com>"]
license = "MIT"
repository = "https://github.com/danodonovan/pqless"
homepage = "https://github.com/danodonovan/pqless"
readme = "README.md"
keywords = ["parquet", "pager", "tui", "cli", "arrow"]
categories = ["command-line-utilities"]
# Not on crates.io (yet); this stops an accidental `cargo publish`.
publish = false

[dependencies]
anyhow = "1.0.104"
arrow = { version = "60.0.0", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
parquet = "60.0.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.dist]
# publish = false (no crates.io) would otherwise hide pqless from dist.
dist = true
