[package]
name = "pqless"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arrow = { version = "60.0.0", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
parquet = "60.0.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
